[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-os"
version = "0.1.0"
description = "Marketing OS — perusahaan marketing AI multi-agen otonom (riset, produksi, penjualan, follow-up, self-healing)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mos = "mos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
